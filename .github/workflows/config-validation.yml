# Data validation workflow: validate data schemas and sample data, fail CI if validation fails, store reports as artifacts

name: Data Validation

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  validate-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install uv
        run: curl -Ls https://astral.sh/uv/install.sh | sh

      - name: Add uv to PATH
        run: echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Sync dependencies
        run: uv sync

      - name: Run config validation
        run: |
          uv run python configs/validate_config.py

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-validation-report
          path: .github/reports/config_validation_report.txt
