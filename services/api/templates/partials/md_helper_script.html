	<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
	<script>
		const introTarget = document.getElementById("project-intro-content");
		const candidates = [
			"static/content/project_intro.md",
			"/static/content/project_intro.md",
			"./static/content/project_intro.md",
		];

		const toSafeHtml = (md) => {
			if (window.marked) {
				const parsed = window.marked.parse(md);
				if (window.DOMPurify) {
					return window.DOMPurify.sanitize(parsed);
				}
				return parsed;
			}

			const escaped = md
				.replace(/&/g, "&amp;")
				.replace(/</g, "&lt;")
				.replace(/>/g, "&gt;");
			return `<pre>${escaped}</pre>`;
		};

		(async () => {
			for (const url of candidates) {
				try {
					const response = await fetch(url);
					if (!response.ok) {
						continue;
					}
					const md = await response.text();
					introTarget.innerHTML = toSafeHtml(md);
					return;
				} catch (_) {
					// Try next candidate path.
				}
			}

			introTarget.textContent = "Could not load project intro content.";
		})();
	</script>
