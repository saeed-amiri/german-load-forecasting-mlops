<script>
  document.querySelectorAll('.header-tabs').forEach((tab) => {
    const { tabLeft, tabRight, tabTop, tabBottom } = tab.dataset;
    if (tabLeft) tab.style.setProperty('--tab-left', tabLeft);
    if (tabRight) tab.style.setProperty('--tab-right', tabRight);
    if (tabTop) tab.style.setProperty('--tab-top', tabTop);
    if (tabBottom) tab.style.setProperty('--tab-bottom', tabBottom);
  });
</script>
