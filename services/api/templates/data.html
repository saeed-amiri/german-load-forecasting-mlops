<!-- services/api/templates/data.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data View</title>
    <link rel="stylesheet" href="static/style.css">
</head>
<body>
    {% include "partials/header.html" %}
    
    <div class="plot-container">
        {{ plot_target | safe }}
    </div>

    <div class="plot-container">
        {{ plot_feature | safe }}
    </div>

    <h2>Historical Load Data</h2>
    
    <div class="table-container">
        {{ table | safe }}
    </div>

    <section>
        <h2>Configuration Files</h2>
        <p>Open the dedicated page to inspect server-rendered YAML config inputs.</p>
        <a href="configs" class="button button1">Open YAML Config Page</a>
    </section>

    {% include "partials/header_tabs_script.html" %}

</body>
</html>
