# deployment/nginx/nginx.conf

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }
    # Resolve docker service names at request time so nginx can start
    # even if some containers are still booting.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;

        # -------------------------
        # Server Homepage
        # -------------------------
        location /static/ {
            alias /etc/nginx/static/;
            try_files $uri =404;
        }
        location / {
            root /etc/nginx/templates;
            index index.html;
        }

        location = /favicon.ico {
            access_log off;
            log_not_found off;
            return 204;
        }
        # -------------------------
        # API
        # -------------------------
        location /api/ {
            auth_request /auth-check;
            auth_request_set $auth_status $upstream_status;

            set $api_upstream api:8000;
            rewrite ^/api/?(.*)$ /$1 break;
            proxy_pass http://$api_upstream;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /api;
            proxy_redirect ~^/(.*)$ /api/$1;
        }

        # -------------------------
        # Auth API
        # -------------------------
        location /auth/ {
            set $auth_upstream auth:8000;
            proxy_pass http://$auth_upstream;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /auth;
        }

        # Internal subrequest target for auth_request.
        # Never exposed to external clients (the location starts with /auth-check,
        # not /auth/, so it won't be matched by the /auth/ proxy above).
        location = /auth-check {
            internal;
            set $auth_upstream auth:8000;
            proxy_pass http://$auth_upstream/auth/check;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header Authorization $http_authorization;
        }

        # -------------------------
        # Airflow 3.x (api-server, React SPA + REST API combined)
        # UVICORN_ROOT_PATH=/airflow tells the ASGI app its mount prefix.
        # Do NOT rewrite/strip the prefix -- pass the full path so the app
        # can resolve its own routes and static assets correctly.
        # -------------------------
        location = /airflow {
            return 301 /airflow/;
        }

        location /airflow/ {
            auth_request /auth-check;

            set $airflow_upstream airflow-api:8080;
            proxy_pass http://$airflow_upstream;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support (Airflow 3.x UI uses WS for live task-log streaming)
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_read_timeout 300s;
            proxy_redirect off;
        }

        # -------------------------
        # Prometheus
        # -------------------------
        location /prometheus/ {
            auth_request /auth-check;

            set $prometheus_upstream prometheus:9090;
            rewrite ^/prometheus/?(.*)$ /$1 break;
            proxy_pass http://$prometheus_upstream;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /prometheus;
        }

        # -------------------------
        # Alertmanager
        # -------------------------
        location /alerts/ {
            auth_request /auth-check;

            set $alertmanager_upstream alertmanager:9093;
            rewrite ^/alerts/?(.*)$ /$1 break;
            proxy_pass http://$alertmanager_upstream;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /alerts;
            proxy_redirect ~^/(.*)$ /alerts/$1;
        }

        # -------------------------
        # cAdvisor
        # -------------------------
        location /cadvisor/ {
            auth_request /auth-check;

            set $cadvisor_upstream cadvisor:8080;
            proxy_pass http://$cadvisor_upstream;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /cadvisor;
        }

        # -------------------------
        # Node Exporter
        # -------------------------
        location = /metrics {
            return 301 $scheme://$http_host/node/metrics;
        }

        location /node/ {
            auth_request /auth-check;

            set $node_upstream node-exporter:9100;
            rewrite ^/node/?(.*)$ /$1 break;
            proxy_pass http://$node_upstream;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /node;
            proxy_redirect ~^/(.*)$ /node/$1;
        }

        # -------------------------
        # Grafana
        # -------------------------
        location = /grafana {
            return 301 /grafana/;
        }

        location /grafana/ {
            auth_request /auth-check;

            set $grafana_upstream grafana:3000;
            proxy_pass http://$grafana_upstream;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /grafana;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_http_version 1.1;
            proxy_read_timeout 300;
        }

        # -------------------------
        # MLflow
        # -------------------------
        location = /mlflow {
            return 301 /mlflow/;
        }

        location /mlflow/ {
            auth_request /auth-check;

            set $mlflow_upstream mlflow:5000;
            rewrite ^/mlflow/?(.*)$ /$1 break;
            proxy_pass http://$mlflow_upstream;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /mlflow;
            proxy_redirect ~^/(.*)$ /mlflow/$1;
        }

    }
}
