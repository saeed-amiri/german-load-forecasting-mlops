<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — German Load Forecasting Platform</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .login-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: calc(100vh - 100px);
        }
        .login-card {
            background: white;
            border-radius: 10px;
            padding: 40px 48px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.10);
            width: 100%;
            max-width: 380px;
        }
        .login-card h2 {
            margin: 0 0 24px;
            font-size: 22px;
            color: #1e293b;
        }
        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            font-size: 0.9em;
            font-weight: 600;
            color: #444;
            margin-bottom: 6px;
        }
        .form-group input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 1em;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }
        .form-group input:focus {
            outline: none;
            border-color: #0d6efd;
        }
        .btn-login {
            width: 100%;
            padding: 11px;
            background: #1e293b;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 6px;
        }
        .btn-login:hover {
            background: #334155;
        }
        .btn-login:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }
        .error-msg {
            color: #dc2626;
            font-size: 0.9em;
            margin-top: 14px;
            display: none;
        }
    </style>
</head>
<body>

<header>
    <h1>German Load Forecasting Platform</h1>
    <p>Sign in to access the platform.</p>
</header>

<div class="login-wrapper">
    <div class="login-card">
        <h2>Sign in</h2>
        <form id="login-form">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" autocomplete="username" required autofocus>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" autocomplete="current-password" required>
            </div>
            <button type="submit" class="btn-login" id="submit-btn">Sign in</button>
            <p class="error-msg" id="error-msg">Invalid username or password.</p>
        </form>
    </div>
</div>

<script src="/static/auth.js"></script>
<script>
    // If already logged in, skip straight to the homepage.
    if (getToken()) {
        window.location.href = "/";
    }

    document.getElementById("login-form").addEventListener("submit", async function (e) {
        e.preventDefault();

        const btn = document.getElementById("submit-btn");
        const errorMsg = document.getElementById("error-msg");
        const username = document.getElementById("username").value.trim();
        const password = document.getElementById("password").value;

        btn.disabled = true;
        btn.textContent = "Signing in…";
        errorMsg.style.display = "none";

        try {
            const response = await fetch("/auth/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ username, password }),
            });

            if (response.ok) {
                const data = await response.json();
                // Store the token and username for use across pages.
                localStorage.setItem("token", data.access_token);
                localStorage.setItem("username", data.username);
                window.location.href = "/";
            } else {
                errorMsg.style.display = "block";
                btn.disabled = false;
                btn.textContent = "Sign in";
            }
        } catch (err) {
            errorMsg.textContent = "Could not reach the auth service. Is the server running?";
            errorMsg.style.display = "block";
            btn.disabled = false;
            btn.textContent = "Sign in";
        }
    });
</script>

</body>
</html>
